<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25H Qui Courent - Backyard PWA</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(185deg, #FF1F7C 0%, #9D4EDD 50%, #FF7043 100%);
      --accent-pink: #FF1F7C;
      --accent-yellow: #CCFF00;
      --strava-orange: #FC4C02;
      --dark-ink: #0F0E17;
      --text-white: #FFFFFF;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-white);
      font-family: 'Comic Neue', cursive, sans-serif;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 3.8rem;
      color: #FFF;
      text-transform: uppercase;
      text-shadow: 
        4px 4px 0px var(--accent-pink),
        -4px -4px 0px var(--dark-ink),
        4px -4px 0px var(--dark-ink),
        -4px 4px 0px var(--dark-ink),
        0px 6px 0px var(--dark-ink);
      letter-spacing: -2px;
      margin: 0;
      display: inline-block;
      transform: rotate(-3deg);
    }

    .brand-subtitle {
      font-family: 'Lilita One', cursive, sans-serif;
      font-size: 1.5rem;
      color: var(--accent-yellow);
      text-shadow: 2px 2px 0px var(--dark-ink);
      margin-top: -10px;
      text-transform: uppercase;
      transform: rotate(1deg);
    }

    .citation-box {
      background: rgba(15, 14, 23, 0.3);
      border: 3px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.95rem;
      margin: 15px auto;
      max-width: 320px;
      text-align: center;
    }

    .custom-card {
      background: #FFF;
      color: var(--dark-ink);
      border: 4px solid var(--dark-ink);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--dark-ink);
      margin-bottom: 20px;
      position: relative;
    }

    .timer-box {
      background: #FF0055;
      color: #FFF;
      border: 4px solid var(--dark-ink);
      border-radius: 24px;
      padding: 15px;
      box-shadow: 6px 6px 0px var(--dark-ink);
      margin-bottom: 20px;
      text-align: center;
    }

    .speech-bubble {
      background: #FFF;
      color: var(--dark-ink);
      border: 3px solid var(--dark-ink);
      padding: 5px 15px;
      border-radius: 30px;
      font-family: 'Lilita One', sans-serif;
      display: inline-block;
      margin-bottom: -15px;
      z-index: 2;
      position: relative;
      transform: rotate(-1deg);
    }

    .timer-display {
      font-family: 'Lilita One', sans-serif;
      font-size: 3.8rem;
      letter-spacing: 2px;
      text-shadow: 4px 4px 0px var(--dark-ink);
      color: var(--accent-yellow);
      margin: 10px 0 0 0;
    }

    .btn-comic {
      font-family: 'Lilita One', sans-serif;
      font-size: 1.3rem;
      text-transform: uppercase;
      padding: 15px 20px;
      border: 4px solid var(--dark-ink);
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-comic-primary {
      background: var(--accent-yellow);
      color: var(--dark-ink);
      box-shadow: 5px 5px 0px var(--dark-ink);
    }

    .btn-comic-strava {
      background: var(--strava-orange);
      color: #FFF;
      box-shadow: 5px 5px 0px var(--dark-ink);
      font-size: 1.1rem;
    }

    .btn-comic:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0px var(--dark-ink);
    }

    .tag-soon {
      background: var(--dark-ink);
      color: var(--accent-yellow);
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <h1 class="brand-logo">25 H</h1>
    <div class="brand-subtitle">Qui courent</div>
    <p style="font-size: 0.9rem; letter-spacing: 1px; font-weight: bold; text-transform: uppercase; margin-top: 5px;">06 Novembre 2026</p>
    
    <div class="citation-box">
      💬 <strong>1 BOUCLE C'EST RIEN,<br>25 BOUCLES C'EST 25X RIEN !</strong>
    </div>
  </div>

  <div style="text-align: center;">
    <span class="speech-bubble">PROCHAIN DÉPART !</span>
  </div>
  <div class="timer-box">
    <div class="timer-display" id="chrono">00:58:12</div>
  </div>

  <div class="custom-card" style="text-align: center;">
    <h2 style="font-family: 'Lilita One', sans-serif; font-size: 2rem; margin: 0; color: #FF1F7C;">
      🎪 BOUCLE <span id="loopCount" style="font-size: 2.8rem; color: #9D4EDD;">1</span> / 25
    </h2>
    <p style="margin: 5px 0 0 0; font-weight: bold;">⛰️ PARCOURS : LES PYRÉNÉES / DANS LA BOUE</p>
  </div>

  <button class="btn-comic btn-comic-primary" onclick="validerBoucle()">
    VALIDER MA BOUCLE ✔️
  </button>

  <button class="btn-comic btn-comic-strava">
    🍊 SE CONNECTER À STRAVA 
    <span class="tag-soon">Bientôt dispo !</span>
  </button>

  <script>
    let loop = 1;
    function validerBoucle() {
      if (loop < 25) {
        loop++;
        document.getElementById('loopCount').innerText = loop;
        alert('🎉 Boucle ' + (loop - 1) + ' validée ! En route pour la boucle ' + loop + ' !');
      } else {
        alert('🏆 FÉLICITATIONS ! Tu as terminé les 25h de la Backyard !');
      }
    }
  </script>
</body>
</html>
