<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard 25h Connectée</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fc4c02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-md text-center py-6">
    <h1 class="text-3xl font-extrabold text-orange-500">BACKYARD 25H</h1>
    <p class="text-gray-400 text-sm mt-1">Édition Connectée &amp; Asynchrone</p>
  </header>

  <main class="w-full max-w-md space-y-6">

    <!-- Bouton Installation PWA -->
    <div id="install-container" class="hidden bg-gray-800 p-4 rounded-xl border border-orange-500/30 text-center">
      <p class="text-sm text-gray-300 mb-2">Installe l'application sur ton téléphone :</p>
      <button id="btn-install" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg w-full transition">
        Installer l'application
      </button>
    </div>

    <!-- Connexion Strava & Consentement -->
    <div id="auth-card" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
      <h2 class="text-xl font-bold mb-4">Participation</h2>
      
      <div class="mb-4">
        <label class="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" id="rgpd-consent" class="mt-1 w-4 h-4 text-orange-500 rounded bg-gray-700 border-gray-600">
          <span class="text-xs text-gray-300">
            J'accepte que mes métriques de course (distance, temps) soient traitées pour la validation des boucles et l'affichage du classement selon la <a href="/confidentialite.html" class="underline text-orange-400">politique de confidentialité</a>.
          </span>
        </label>
      </div>

      <button id="btn-strava" disabled class="w-full bg-gray-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 cursor-not-allowed transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7.92 15.632h4.171"/></svg>
        Se connecter avec Strava
      </button>
    </div>

    <!-- Timer / Signal Sonore -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 text-center">
      <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Signal horaire Backyard</h3>
      <p class="text-xs text-gray-400 mb-4">Avertisseur sonore toutes les 60 minutes pendant l'effort.</p>
      <button id="btn-alarm" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition">
        Activer le signal horaire
      </button>
    </div>

    <!-- Classement en direct -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
      <h2 class="text-xl font-bold mb-4 flex items-center justify-between">
        Classement <span class="text-xs bg-orange-500/20 text-orange-400 px-2 py-1 rounded">En direct</span>
      </h2>
      <div id="leaderboard" class="space-y-3">
        <p class="text-gray-500 text-sm text-center">Chargement du classement...</p>
      </div>
    </div>

  </main>

  <script>
    // 1. PWA Service Worker & Install Prompt
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-container').classList.remove('hidden');
    });

    document.getElementById('btn-install').addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          document.getElementById('install-container').classList.add('hidden');
        });
      }
    });

    // 2. Gestion du consentement RGPD & Strava
    const consentCheckbox = document.getElementById('rgpd-consent');
    const stravaBtn = document.getElementById('btn-strava');

    consentCheckbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        stravaBtn.disabled = false;
        stravaBtn.classList.remove('bg-gray-600', 'cursor-not-allowed');
        stravaBtn.classList.add('bg-[#fc4c02]', 'hover:bg-orange-600');
      } else {
        stravaBtn.disabled = true;
        stravaBtn.classList.add('bg-gray-600', 'cursor-not-allowed');
        stravaBtn.classList.remove('bg-[#fc4c02]', 'hover:bg-orange-600');
      }
    });

    stravaBtn.addEventListener('click', () => {
      if (!stravaBtn.disabled) {
        window.location.href = '/api/auth/strava';
      }
    });

    // 3. Audio Alarm (Chime Backyard)
    document.getElementById('btn-alarm').addEventListener('click', () => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      alert('Signal horaire activé ! Un bip retentira au départ de chaque heure.');
      
      setInterval(() => {
        const now = new Date();
        if (now.getMinutes() === 0 && now.getSeconds() === 0) {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Note La (880Hz)
          osc.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 1.5);
        }
      }, 1000);
    });

    // 4. Chargement du classement
    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const container = document.getElementById('leaderboard');
        
        if (data.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-sm text-center">Aucune boucle enregistrée pour le moment.</p>';
          return;
        }

        container.innerHTML = data.map((item, index) => `
          <div class="flex items-center justify-between p-3 bg-gray-700/50 rounded-lg">
            <div class="flex items-center gap-3">
              <span class="font-bold text-lg text-orange-400 w-6">#${index + 1}</span>
              <div>
                <p class="font-semibold text-sm">${item.name}</p>
                <p class="text-xs text-gray-400">Temps cumulé : ${item.total_time}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-lg font-extrabold text-white">${item.laps}</span>
              <span class="text-xs text-gray-400 block">boucle(s)</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
